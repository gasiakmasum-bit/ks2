<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>ORBITA — апгрейдер скінів CS2 (віртуальні монети)</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="co" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#eab948"/><circle cx="12" cy="12" r="5" fill="none" stroke="#1a1305" stroke-width="2.4"/></symbol>
  <symbol id="up" viewBox="0 0 40 40"><path d="M20 5 35 22h-9.5v13h-11V22H5z"/></symbol>
</svg>
<div id="root"><div class="boot"><svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><circle cx="32" cy="32" r="22" fill="none" stroke="#2d3543" stroke-width="4"/><path d="M32 10a22 22 0 0 1 22 22" fill="none" stroke="#eab948" stroke-width="4" stroke-linecap="round"/></svg><b>ORBITA</b></div></div>
<style>.boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;background:#0d0f13;color:#eab948;font:700 22px/1 Oswald,'Arial Narrow',sans-serif;letter-spacing:.2em}.boot svg{animation:bs 1s linear infinite}@keyframes bs{to{transform:rotate(360deg)}}</style>
<script type="module" src="/src/main.jsx"></script>
<script>
// Якщо за 12 с застосунок не змонтувався — показуємо причину замість вічного спінера
setTimeout(function(){var b=document.querySelector('.boot');if(!b)return;
b.insertAdjacentHTML('beforeend','<small style="font:400 13px/1.4 sans-serif;letter-spacing:0;color:#9aa4b2;text-align:center;max-width:320px">Не вдалося завантажити застосунок. Відкрийте консоль (F12 → Console/Network): ймовірно, не знайдено файли /assets/*.js. Сайт має відкриватися з опублікованої папки dist, а не з вихідного index.html.</small>')},12000);
</script>
</body>
</html>
